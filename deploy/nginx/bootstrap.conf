# Saarthi — pre-TLS bootstrap.
#
# Used only until a Let's Encrypt certificate exists. It serves the app over
# plain HTTP and, more importantly, keeps /.well-known/acme-challenge/
# reachable so certbot's webroot challenge can succeed. deploy.sh installs the
# full TLS config in place of this one as soon as the certificate is present.
#
# Note: COOKIE_SECURE=true in .env, so the refresh cookie is not sent over
# plain HTTP. Sessions will not persist until TLS is live — that is expected
# here, not a fault.

upstream saarthi_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name vorldxsaarthi.com www.vorldxsaarthi.com _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    root /var/www/saarthi/web;
    index index.html;

    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm image/svg+xml;

    access_log /var/log/nginx/saarthi.access.log;
    error_log  /var/log/nginx/saarthi.error.log;

    location /api/ {
        proxy_pass http://saarthi_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location /ws {
        proxy_pass http://saarthi_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        proxy_pass http://saarthi_api;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        access_log off;
    }

    location /assets/ {
        include /etc/nginx/snippets/saarthi-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/saarthi-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        include /etc/nginx/snippets/saarthi-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
