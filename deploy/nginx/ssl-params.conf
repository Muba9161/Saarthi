# Shared TLS policy for Saarthi — installed to /etc/nginx/snippets/saarthi-ssl.conf
#
# These live at *server* scope rather than http scope on purpose. Ubuntu's stock
# /etc/nginx/nginx.conf already sets ssl_protocols and ssl_prefer_server_ciphers
# in the http block, and it still enables TLSv1 and TLSv1.1 — both deprecated.
# sites-enabled/* is included after those lines, so repeating them at http scope
# is a duplicate-directive error; at server scope they override cleanly.
#
# Nothing here is fetched from certbot. Its options-ssl-nginx.conf ships with
# the nginx plugin, and this deployment issues with `certonly --webroot`.

ssl_protocols TLSv1.2 TLSv1.3;

# ECDHE only. Forward secrecy without any DHE ciphersuite is also what removes
# the need for a dhparam file at all.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# TLS 1.3 clients choose their own order, and modern 1.2 clients already offer a
# sane one; forcing server preference mainly risks pinning something weaker.
ssl_prefer_server_ciphers off;

ssl_session_cache shared:SaarthiTLS:10m;
ssl_session_timeout 1d;
# Session tickets without rotation undermine forward secrecy, and nginx has no
# built-in rotation, so they stay off.
ssl_session_tickets off;

# No OCSP stapling. Let's Encrypt retired OCSP and no longer puts a responder
# URL in its certificates, so nginx logged `"ssl_stapling" ignored, no OCSP
# responder URL` on every reload and stapled nothing. Revocation is handled by
# the short 90-day lifetime instead. The resolver directive that stapling
# needed is gone with it.
