# Saarthi — vorldxsaarthi.com
#
# One origin serves everything, which is what the app is built for: with
# VITE_API_URL blank the browser calls relative /api and /ws paths, so there is
# no CORS preflight and no cross-site cookie to be partitioned away.
#
#   /            -> the built SPA in /var/www/saarthi/web
#   /api/v1/...  -> Fastify on 127.0.0.1:4000
#   /ws, /ws/device -> the same Fastify, upgraded to WebSocket
#   /health...   -> liveness and readiness probes

upstream saarthi_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# WebSocket upgrade: pass "upgrade" through only when the client asked for it,
# and a plain close otherwise. Hardcoding Connection: upgrade breaks keepalive
# on the ordinary REST proxy that shares this upstream.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name vorldxsaarthi.com www.vorldxsaarthi.com;

    # Certbot's webroot challenge must stay reachable over plain HTTP for
    # renewals, so it is matched before the redirect below.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://vorldxsaarthi.com$request_uri;
    }
}

# www -> apex, so cookies are issued for exactly one host.
server {
    # `http2 on;` is nginx 1.25.1+; Ubuntu 24.04 ships 1.24, so the parameter
    # form is used instead. Parameters apply to the listen socket, so only the
    # first server block for a given address:port needs to carry them.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vorldxsaarthi.com;

    ssl_certificate     /etc/letsencrypt/live/vorldxsaarthi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vorldxsaarthi.com/privkey.pem;
    include /etc/nginx/snippets/saarthi-ssl.conf;

    return 301 https://vorldxsaarthi.com$request_uri;
}

server {
    # `http2 on;` is nginx 1.25.1+; Ubuntu 24.04 ships 1.24, so the parameter
    # form is used instead. Parameters apply to the listen socket, so only the
    # first server block for a given address:port needs to carry them.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vorldxsaarthi.com;

    ssl_certificate     /etc/letsencrypt/live/vorldxsaarthi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vorldxsaarthi.com/privkey.pem;
    include /etc/nginx/snippets/saarthi-ssl.conf;

    # Security headers are applied per-location via the snippet below, not here.
    # See deploy/nginx/security-headers.conf for why.

    root /var/www/saarthi/web;
    index index.html;

    # STORAGE_MAX_FILE_SIZE is 10 MiB; leave headroom for multipart framing.
    client_max_body_size 12m;
    client_body_timeout 120s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    # The default is 1, which leaves roughly 15% on the table on this bundle
    # for a saving in CPU that a proxied API response does not notice. Static
    # assets do not use this path at all — deploy.sh compresses them at level 9
    # ahead of time and gzip_static serves those files verbatim.
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm image/svg+xml
               application/vnd.mapbox-vector-tile;

    access_log /var/log/nginx/saarthi.access.log;
    error_log  /var/log/nginx/saarthi.error.log;

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://saarthi_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;   # document downloads stream rather than buffer
    }

    # --- WebSockets --------------------------------------------------------
    # Prefix match, so this covers both /ws (browser clients) and /ws/device
    # (the Android device app).
    location /ws {
        proxy_pass http://saarthi_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The client heartbeats every 25s; this only has to outlast that.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Probes ------------------------------------------------------------
    location /health {
        proxy_pass http://saarthi_api;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        access_log off;
    }

    # --- SPA ---------------------------------------------------------------
    # Vite emits content-hashed filenames under /assets, so those are safe to
    # cache forever. index.html must never be cached, or a released build keeps
    # pointing browsers at asset hashes that no longer exist.
    # One Cache-Control per response: `expires` emits its own, so setting both
    # it and add_header produced two conflicting headers on every asset.
    location /assets/ {
        include /etc/nginx/snippets/saarthi-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Prefer the .gz deploy.sh wrote beside each asset: maximum compression,
        # and no CPU spent re-deriving it per request. Falls through to the
        # uncompressed file for clients that did not ask for gzip.
        gzip_static on;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/saarthi-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        include /etc/nginx/snippets/saarthi-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
