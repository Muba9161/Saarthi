# Security headers for statically served responses.
# Installed to /etc/nginx/snippets/saarthi-security-headers.conf
#
# Included per-location rather than declared once at server scope, because
# nginx's add_header is not additive across levels: a location that defines any
# add_header of its own discards every add_header inherited from the server
# block. /assets/ and = /index.html both set their own Cache-Control, so at
# server scope these headers were silently dropped on exactly the responses
# that carry the application.
#
# Proxied locations (/api/, /ws, /health) are deliberately excluded. The API
# sets its own headers through helmet, and repeating them here would emit each
# one twice.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
